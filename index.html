<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>perfil - Calebe</title>
    <style>
        /* Estilos para centralizar e organizar a página */
        body {
            font-family: Arial, sans-serif;
            background-color:black;
            display: flex;
            justify-content: center;
            align-items: 100vh;
            margin: 0;
        }

        .perfil-container {
            text-align: center;
            background-color: black;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 350px;
            width: 100%;
        }

        .foto-perfil {
            width: 150px;
            height: 150px;
            border-radius: 50%; 
            object-fit: cover;
            border: 3px solid black;
            margin-bottom: 15px;
        }

        .subtitulo {
            font-size: 16px;
            color: #666;
            margin-bottom: 25px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: blue;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            box-sizing: border-box;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    
    h2 {
        color: white;
            font-size: 26px;
            margin-bottom: 10px;
            margin-top: 15px; 

    }
    
    </style>
</head>
<body>
    
    <div class="perfil-container"> 
        <img class="foto-perfil" src="https://server.wallpaperalchemy.com/storage/wallpapers/928/gojo-satoru-minimalist-4k-anime-wallpaper.jpg" alt="foto do Calebe">

        <h2> Calebe </h2>
            
        <p class="subtitulo">Desenvolvedor front-end no programa trilhas</p>

        <a href="#" class="btn">Sobre mim</a>
        <a href="#" class="btn">veja os meus projetos</a>
        <a href="#" class="btn">Acesse os meus certificados</a>
        </div>
</body>
</html>
